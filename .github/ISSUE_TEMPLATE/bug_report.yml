name: Bug report
description: Something behaves differently from the docs
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command, the query shape and the output. Redact names and values you do not want public.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `pgsage --version`, your PostgreSQL version, Python version and OS.
    validations:
      required: true
