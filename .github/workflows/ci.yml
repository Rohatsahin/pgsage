name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: 🧪 Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      PYTHON_VERSION: ${{ matrix.python }}
      UV_LOCKED: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🐍 Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: 📦 Install dependencies
        id: install
        run: uv sync --all-extras --locked

      - name: 🐘 Pull Postgres image
        id: pull
        continue-on-error: true
        run: docker pull postgres:17

      - name: 🧹 Lint (ruff check)
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: uv run ruff check --output-format=github .

      - name: 🎨 Format (ruff format)
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: uv run ruff format --check --diff .

      - name: 🔎 Types (pyright strict)
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: uv run pyright

      - name: 🧪 Tests (pytest)
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: uv run pytest -p no:cacheprovider --junitxml=reports/junit.xml --durations=5

      - name: 📊 Job summary
        if: ${{ always() }}
        env:
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_PULL: ${{ steps.pull.outcome }}
          STEP_LINT: ${{ steps.lint.outcome }}
          STEP_FORMAT: ${{ steps.format.outcome }}
          STEP_TYPES: ${{ steps.types.outcome }}
          STEP_TESTS: ${{ steps.tests.outcome }}
        run: python3 scripts/ci_summary.py reports/junit.xml || true

      - name: 📎 Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-python-${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: ignore

      - name: 🚦 Gate
        if: ${{ always() }}
        env:
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_LINT: ${{ steps.lint.outcome }}
          STEP_FORMAT: ${{ steps.format.outcome }}
          STEP_TYPES: ${{ steps.types.outcome }}
          STEP_TESTS: ${{ steps.tests.outcome }}
        run: |
          for step in INSTALL LINT FORMAT TYPES TESTS; do
            outcome="STEP_${step}"
            if [ "${!outcome}" != "success" ]; then
              echo "❌ ${step,,}: ${!outcome}"
              failed=1
            else
              echo "✅ ${step,,}"
            fi
          done
          exit "${failed:-0}"

  package:
    name: 📦 Wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 🏗️ Build wheel and sdist
        run: uv build

      - name: 🧪 Install the wheel with no extras and run it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/pgsage --version
          /tmp/smoke/bin/pgsage --help
          /tmp/smoke/bin/python -c "import pgsage.cli"
          /tmp/smoke/bin/python -m pgsage --version
          /tmp/smoke/bin/pgsage install-skill --dir /tmp/skills
          test -s /tmp/skills/pgsage/SKILL.md
          grep -q "^name: pgsage" /tmp/skills/pgsage/SKILL.md
          cd "$(mktemp -d)"
          /tmp/smoke/bin/pgsage init
          /tmp/smoke/bin/pgsage connections | grep -q '"name": "scratch"'
          cd -
          set +e
          /tmp/smoke/bin/pgsage-mcp 2>/tmp/mcp.err
          code=$?
          set -e
          cat /tmp/mcp.err
          if [ "$code" != "2" ] || ! grep -q "pgsage\[mcp\]" /tmp/mcp.err; then
            echo "❌ pgsage-mcp should exit 2 with an install hint when the mcp extra is missing"
            exit 1
          fi
          echo "✅ base install works, the skill installs, and the missing extra is reported clearly"

      - name: 🔎 Check the package contents
        run: |
          python3 - <<'PY'
          import glob, tarfile, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          required = ["pgsage/skill/SKILL.md", "pgsage/py.typed"]
          missing = [n for n in required if n not in wheel]
          assert not missing, f"missing from wheel: {missing}"
          assert any(n.endswith("LICENSE") for n in wheel), "LICENSE missing from wheel"
          assert any(n.endswith("/LICENSE") for n in sdist), "LICENSE missing from sdist"
          print("✅ wheel and sdist contain the skill, py.typed and the LICENSE")
          PY

      - name: 📎 Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
